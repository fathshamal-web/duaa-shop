name: Build Duaa Shop APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DuaaShop.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DuaaShop
          path: DuaaShop.apk
      - name: Publish download (Release "latest")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DuaaShop.apk --title "Duaa Shop (latest)" --notes "Download DuaaShop.apk on your Android phone and open it to install. Built from commit ${GITHUB_SHA::7}."
