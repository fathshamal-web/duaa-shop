name: Probe D4D pages
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sample pages
        run: |
          mkdir pages
          UA="Mozilla/5.0 (Linux; Android 14; SM-S911B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"
          curl -sSL -A "$UA" -H "Accept-Language: en" -o pages/search_onion.html -w "search %{http_code} %{size_download}\n" "https://d4donline.com/en/uae/abu-dhabi/products?search=onion"
          curl -sSL -A "$UA" -H "Accept-Language: en" -o pages/search_egg.html -w "search %{http_code} %{size_download}\n" "https://d4donline.com/en/uae/abu-dhabi/products?search=egg"
          curl -sSL -A "$UA" -H "Accept-Language: en" -o pages/product.html -w "product %{http_code} %{size_download}\n" "https://d4donline.com/en/uae/abu-dhabi/products/desert-fresh-market--2990/100260831/top-product"
          curl -sSL -A "$UA" -o pages/clicflyer.html -w "clicflyer %{http_code} %{size_download}\n" "https://clicflyer.com/shoppers/en/united-arab-emirates/abu-dhabi/home" || true
      - name: Save pages to probe branch
        run: |
          cd pages
          git init -q -b probe
          git -c user.name=bot -c user.email=bot@example.com add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm "probe pages"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe
