name: Probe D4D search
on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Comma-separated searches"
        default: "fresh chicken,chicken"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Search D4D like the app does
        env:
          QUERIES: ${{ github.event.inputs.queries }}
        run: |
          mkdir pages
          cat > probe.py <<'PY'
          import json, os, re, urllib.parse, urllib.request, http.cookiejar
          UA = "Mozilla/5.0 (Linux; Android 14; SM-S911B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"
          jar = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          ref = "https://d4donline.com/en/uae/abu-dhabi/products"
          html = op.open(urllib.request.Request(ref, headers={"User-Agent": UA})).read().decode()
          tok = re.search(r'name="csrf-token" content="([^"]+)"', html).group(1)
          param = re.search(r'name="csrf-param" content="([^"]+)"', html).group(1)
          m = re.search(r'id="country"[^>]*value="([^"]*)"', html); country = m.group(1) if m else ""
          out = {}
          for q in os.environ["QUERIES"].split(","):
              q = q.strip(); rows = []
              for off in range(0, 200, 20):
                  body = urllib.parse.urlencode({"search": q, "offset": off, "limit": 20, "country": country, param: tok}).encode()
                  req = urllib.request.Request("https://d4donline.com/products/search", data=body, headers={"User-Agent": UA,
                        "X-CSRF-Token": tok, "X-Requested-With": "XMLHttpRequest", "Referer": ref + "?search=" + urllib.parse.quote(q),
                        "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8", "Origin": "https://d4donline.com"})
                  d = json.loads(op.open(req).read().decode()); it = d.get("items") or []
                  rows += [{"price": x.get("price"), "was": x.get("was_price"), "store": x.get("text_footer_en"),
                            "desc": str(x.get("description") or "").split("\n")[0][:120], "to": x.get("valid_to")} for x in it]
                  if len(it) < 20: break
              out[q] = rows
              print(q, len(rows))
          json.dump(out, open("pages/search.json", "w"), indent=1)
          PY
          python3 probe.py
      - name: Save results to probe branch
        run: |
          cd pages
          git init -q -b probe
          git -c user.name=bot -c user.email=bot@example.com add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm "probe"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe
